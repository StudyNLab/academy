# AIONIT 감시 (Gatus, M10 · 2026-11-05 운영자 결정). Academy-app 의 ~/aionit-monitor/ 에서 따로 돈다.
# 앱 배포(deploy.sh, 프로젝트 aionit-app)와 다른 프로젝트라 배포가 감시를 내리거나 지우지 않는다.
# 화면: VM 의 127.0.0.1:8085 (SSH 터널, infra/README.md 감시). 172.30.0.10:8085 는 data VM 백업 결과 푸시용 (내부망)
# 비밀값(푸시 토큰 · 메일)은 ~/aionit-monitor/.env (600, Git 제외). 이름은 config.yaml 머리말
name: aionit-monitor

services:
  gatus:
    image: ghcr.io/twin/gatus:${GATUS_TAG:-v5.37.0}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      - "127.0.0.1:8085:8080"
      - "172.30.0.10:8085:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gatus-data:/data
    networks:
      default:
      # 앱 컨테이너(web · caddy · mailpit)를 이름으로 본다. worker 는 이 망에서 http://gatus:8080 으로 푸시한다
      app:
        aliases: [gatus]

networks:
  app:
    name: aionit-app_default
    external: true

volumes:
  gatus-data:
