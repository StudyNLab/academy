# AIONIT 감시 · 운영 서버(클라우드 한 대)용. 서버의 ~/aionit-monitor/ 에서 따로 돈다. 테스트 서버용은 infra/monitor/compose.yaml.
# 다른 점: 백업 결과 푸시를 같은 서버 안(127.0.0.1:8085)에서 받으므로 내부망 주소에 열지 않는다.
# 앱 배포(deploy.sh, 프로젝트 aionit-app)와 다른 프로젝트라 배포가 감시를 내리거나 지우지 않는다.
# 화면: 서버의 127.0.0.1:8085 (SSH 터널로 본다). backup.sh 도 이 주소로 결과를 보낸다
# 비밀값(푸시 토큰 · 메일)은 ~/aionit-monitor/.env (600, Git 제외). 이름은 config.yaml 머리말
name: aionit-monitor

services:
  gatus:
    image: ghcr.io/twin/gatus:${GATUS_TAG:-v5.37.0}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - gatus-data:/data
    networks:
      default:
      # 앱 컨테이너(web · caddy · postgres · garage)를 이름으로 본다. worker 는 이 망에서 http://gatus:8080 으로 푸시한다
      app:
        aliases: [gatus]

networks:
  app:
    name: aionit-app_default
    external: true

volumes:
  gatus-data:
