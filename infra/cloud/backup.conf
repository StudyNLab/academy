# 운영 서버(클라우드 한 대)의 backup.sh 설정. 서버의 ~/aionit/backup.conf 로 둔다 (deploy.sh --cloud 가 복사한다).
# 기본값과 뜻은 infra/data-vm/backup.sh 의 '서버마다 다른 값'.
SHARE=/srv/backup        # 서버 디스크. 사무실 테스트 서버 data VM 이 매일 받아 간다 (infra/cloud/pull-backup.sh)
SHARE_IS_MOUNT=0
RCLONE_NETWORK=aionit-app_default   # garage-backup.env 의 주소는 http://garage:3900
APP_CONFIG=local
