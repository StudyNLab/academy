# AIONIT 테스트 운영 · 앱 서버 (Academy-app, 172.30.0.10)
# 이미지는 개발 VM 에서 빌드해 배포 스크립트(infra/scripts/deploy.sh)가 넣는다. 태그는 .env 의 APP_TAG.
# 비밀값은 VM 의 ~/aionit/.env (Git 에 올리지 않음).
name: aionit-app

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:${CADDY_TAG}
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    image: aionit-web:${APP_TAG}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    expose:
      - "3000"

  worker:
    image: aionit-worker:${APP_TAG}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    # 내릴 때 영상 변환을 멈추고 작업을 대기열로 돌려놓을 시간
    stop_grace_period: 30s

  # 테스트 운영용 메일 받는 곳: 밖으로 보내지 않고 모아 둔다 (인증 메일 · 비밀번호 재설정 확인용).
  # 메일 발송 서비스가 정해지면 .env 의 SMTP_URL 만 그 서비스로 바꾸고 이 서비스는 지운다.
  # 웹 화면은 VM 의 127.0.0.1:8025 에만 연다 (infra/README.md 의 SSH 터널로 본다).
  mailpit:
    image: axllent/mailpit:${MAILPIT_TAG}
    restart: unless-stopped
    logging: *logging
    environment:
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

volumes:
  caddy-data:
  caddy-config:
